# GoReleaser configuration for promptarena-deploy-omnia
# See: https://goreleaser.com

version: 2

builds:
  - id: promptarena-deploy-omnia
    binary: promptarena-deploy-omnia
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/AltairaLabs/promptarena-deploy-omnia/internal/omnia.Version={{.Version}}
      - -X github.com/AltairaLabs/promptarena-deploy-omnia/internal/omnia.Commit={{.Commit}}
      - -X github.com/AltairaLabs/promptarena-deploy-omnia/internal/omnia.Date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  # Bare binary (no tar.gz) named to match exactly what the promptarena
  # installer downloads: promptarena-deploy-omnia_<goos>_<goarch>.
  # {{ .Os }}/{{ .Arch }} are the raw GOOS/GOARCH the installer computes via
  # runtime.GOOS/runtime.GOARCH — no x86_64/title-case translation.
  - id: default
    formats: [binary]
    name_template: "promptarena-deploy-omnia_{{ .Os }}_{{ .Arch }}"

# An SBOM per released binary, attached to the GitHub release.
#
# A risk analyst asking a third-party questionnaire wants a document they can
# read, not an attestation they have to pull off an OCI manifest with buildx.
# The image carries its own SBOM as an OCI referrer; this is the same evidence
# in the form the question is actually asked in.
#
# SPDX JSON because it is what most questionnaires name. Generated from the
# artifacts GoReleaser just built, so the SBOM and the binary cannot drift.
# Named from .ArtifactName, which already carries GOOS/GOARCH.
#
# The obvious "${artifact}.spdx.sbom.json" does not work here: every platform
# builds a binary of the same name, so all four SBOMs collide on one filename
# and GoReleaser keeps one of them — describing a platform nobody can
# identify. It warns rather than fails, so this ships quietly broken.
sboms:
  - id: binaries
    artifacts: binary
    documents:
      - "{{ .ArtifactName }}.spdx.sbom.json"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: AltairaLabs
    name: promptarena-deploy-omnia
  draft: true
  name_template: "promptarena-deploy-omnia {{.Version}}"
