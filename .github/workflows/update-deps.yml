name: Update upstream dependencies

# Two upstreams now, not one. The deploy contract (runtime/deploy and
# adaptersdk) moved out of PromptKit into promptarena, so a release there
# reaches this adapter only if we listen for it — which nothing did, leaving the
# module that defines the adapter's own interface with no update path at all.
on:
  repository_dispatch:
    types: [promptkit-release, promptarena-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update PromptKit to ${{ github.event.client_payload.version }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # Check out with the PAT so the branch push below is attributed to it
        # rather than to GITHUB_TOKEN — see the note on "Create pull request".
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26.0'

    - name: Update go.mod
      env:
        VERSION: ${{ github.event.client_payload.version }}
        # Read from the environment rather than interpolated into the script:
        # a dispatch payload is attacker-controlled input to a shell otherwise.
        EVENT: ${{ github.event.action }}
      run: |
        if [ "$EVENT" = "promptarena-release" ]; then
          echo "Updating promptarena to $VERSION..."
          go mod edit -require="github.com/AltairaLabs/promptarena@$VERSION"
          go mod edit -dropreplace=github.com/AltairaLabs/promptarena
        else
          echo "Updating PromptKit runtime to $VERSION..."

          # Update required versions for PromptKit modules
          go mod edit -require="github.com/AltairaLabs/PromptKit/runtime@$VERSION"
          go mod edit -require="github.com/AltairaLabs/PromptKit/pkg@$VERSION"

          # Drop all replace directives — the published modules are now available
          go mod edit -dropreplace=github.com/AltairaLabs/PromptKit/runtime
          go mod edit -dropreplace=github.com/AltairaLabs/PromptKit/pkg
        fi

        # Tidy to resolve dependencies
        go mod tidy

        echo "✓ Updated go.mod"

    - name: Remove sibling checkout from CI
      env:
        VERSION: ${{ github.event.client_payload.version }}
      run: |
        # Check if CI still has the sibling checkout step
        if grep -q 'Checkout PromptKit' .github/workflows/ci.yml; then
          echo "Removing sibling PromptKit checkout from CI..."

          # Use sed to remove the checkout step from ci.yml
          # Remove the 3-line block: "- name: Checkout PromptKit (sibling)\n      run: git clone..."
          sed -i '/- name: Checkout PromptKit (sibling)/,/\.\.\/promptkit/d' .github/workflows/ci.yml

          echo "✓ Removed sibling checkout from ci.yml"
        fi

        if grep -q 'Checkout PromptKit' .github/workflows/release.yml; then
          echo "Removing sibling PromptKit checkout from release.yml..."
          sed -i '/- name: Checkout PromptKit (sibling)/,/\.\.\/promptkit/d' .github/workflows/release.yml
          echo "✓ Removed sibling checkout from release.yml"
        fi

    - name: Verify build
      run: |
        echo "Verifying build without replace directives..."
        go build -o promptarena-deploy-omnia .
        echo "✓ Build succeeded"

    - name: Verify tests
      run: |
        echo "Running tests..."
        go test ./... -v -race -count=1
        echo "✓ Tests passed"

    # The PAT is required, not a preference. GitHub deliberately does not start
    # workflow runs for events raised by GITHUB_TOKEN (a recursion guard), so a
    # PR opened with it never gets CI, its required checks never report, and it
    # sits mergeable-but-BLOCKED forever. That is what stranded the v1.5.7 and
    # v1.5.8 bump PRs. Opening the PR as a real user makes CI run normally.
    - name: Create pull request
      env:
        VERSION: ${{ github.event.client_payload.version }}
        EVENT: ${{ github.event.action }}
        GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        if [ "$EVENT" = "promptarena-release" ]; then
          UPSTREAM="promptarena"
        else
          UPSTREAM="PromptKit"
        fi
        BRANCH="deps/$UPSTREAM-$VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"
        git add -A
        git commit -m "deps: update $UPSTREAM to $VERSION

        Drop replace directives — published module is now available on
        the Go proxy. Remove sibling PromptKit checkout from CI workflows."

        git push origin "$BRANCH"

        # Unquoted delimiter, so $VERSION interpolates. With <<'PREOF' the body
        # rendered the literal string "$VERSION" in every PR this ever opened.
        gh pr create \
          --title "deps: update $UPSTREAM to $VERSION" \
          --body "$(cat <<PREOF
        ## Summary

        - Update \`$UPSTREAM\` to $VERSION
        - Drop \`replace\` directives from \`go.mod\` (published module available)

        Triggered automatically by the $UPSTREAM release of $VERSION.

        ## Verification

        - [x] \`go build\` passes without replace directives
        - [x] \`go test ./... -race\` passes

        🤖 Generated automatically by the update-deps workflow
        PREOF
        )"

        echo "✓ Created PR for $BRANCH"
